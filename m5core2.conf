# M5 Core2 WiFi status board heartbeat. Install to /etc/zabbix/zabbix_agentd.conf.d/m5core2.conf
# and restart zabbix-agent. See ~/projects/m5-core2-chk/README.md.
UserParameter=m5core2.heartbeat.age,/home/jkozik/projects/m5-core2-chk/m5core2_check.sh age
UserParameter=m5core2.health[*],/home/jkozik/projects/m5-core2-chk/m5core2_check.sh health $1
UserParameter=m5core2.field[*],/home/jkozik/projects/m5-core2-chk/m5core2_check.sh field $1
