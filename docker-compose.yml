# M5 Core2 heartbeat listener. Runs on the Debian TinyPC next to the Zabbix proxy.
# Needs a .env file (copy .env.example): M5CORE2_TOKEN and BIND_IP.
services:
  m5core2-heartbeat:
    build: .
    image: m5core2-heartbeat:1
    container_name: m5core2-heartbeat
    user: "1000:1000"            # jkozik, so ./state is writable and owned by the project owner
    env_file: .env
    environment:
      PORT: "9099"
      STATE_DIR: /state
    ports:
      - "${BIND_IP}:9099:9099/udp"   # LAN address only
    volumes:
      - ./state:/state
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 32m               # observed ~7 MiB, also during a 100,000 datagram/s flood
    memswap_limit: 32m           # same as mem_limit = no swap
    cpus: "0.25"                 # idle 0%; a flood would otherwise pin a full core
    pids_limit: 16               # observed 1
    logging:
      driver: json-file
      options:
        max-size: "1m"
        max-file: "3"
    healthcheck:                 # healthy = the listener loop touched /state/alive in the last 90 s
      test: ["CMD", "python", "-c", "import os,sys,time; sys.exit(0 if time.time()-os.stat('/state/alive').st_mtime < 90 else 1)"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped
